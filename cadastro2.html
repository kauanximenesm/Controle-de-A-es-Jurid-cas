<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas | CJuris</title>
    <link rel="stylesheet" href="Css/global.css">
    <link rel="stylesheet" href="Css/login.css">
    <link rel="icon" href="Assets/favicon.ico">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <img src="Assets/favicon.ico" alt="Logo" class="login-logo">
            <h2>Novo Cadastro de Pessoa</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 20px;">Preencha os dados civis para o processo.</p>

            <form id="formPessoa">
                <div class="input-group">
                    <label for="p_nome">Nome Completo</label>
                    <input type="text" id="p_nome" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <label for="p_cpf">CPF (11 dígitos)</label>
                    <input type="text" id="p_cpf" maxlength="11" placeholder="Ex: 00011122233" required>
                </div>

                <div class="input-group">
                    <label for="p_nascimento">Data de Nascimento</label>
                    <input type="date" id="p_nascimento" required>
                </div>

                <div class="input-group">
                    <label for="p_tipo">Vínculo</label>
                    <select id="p_tipo" class="meu-input-estilizado">
                    <option value="4">Cliente</option> 
                    <option value="1">Advogado</option>
                    </select>
                </div>

                <button type="submit" class="btn-login">Finalizar Registro</button>
            </form>

            <div class="login-footer">
                <a href="PaginaCentral.html" style="color: #3498db; text-decoration: none; font-weight: bold;">← Voltar ao Painel</a>
            </div>
        </div>
    </div>

    <script src="Js/pessoas.js"></script>
</body>
</html>
