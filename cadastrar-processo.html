<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Processo | CJuris</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
        }
        .container-cadastro {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header-area {
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2 { margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #7f8c8d; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--primary-color); outline: none; }
        .btn-salvar {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-cancelar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #95a5a6;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container-cadastro">
    <div class="header-area">
        <h2><span class="material-icons">gavel</span> Abertura de Processo</h2>
    </div>

    <form id="formAcao">
        <div class="form-group">
            <label>Resumo / Descrição do Processo</label>
            <textarea id="descricao" required rows="3" placeholder="Ex: Ação revisional de contrato de financiamento..."></textarea>
        </div>

        <div class="form-group">
            <label>Prazo Limite / Audiência</label>
            <input type="date" id="prazo" required>
        </div>

        <div class="form-group">
            <label>ID do Cliente</label>
            <input type="number" id="cliente_id" required placeholder="Consulte o ID na lista de clientes">
        </div>

        <div class="form-group">
            <label>ID do Advogado Responsável</label>
            <input type="number" id="advogado_id" required placeholder="ID do advogado do caso">
        </div>

        <div class="form-group">
            <label>ID do Juiz Relator</label>
            <input type="number" id="juiz_id" placeholder="ID do juiz cadastrado se houver">
        </div>

        <div class="form-group">
            <label>ID do Tipo de Ação</label>
            <input type="number" id="tipo_acao_id" required placeholder="Ex: 1 para Cível, 2 para Trabalhista...">
        </div>

        <div class="form-group">
            <label>ID do Status Inicial</label>
            <input type="number" id="status_id" required placeholder="Ex: 1 para Inicial, 2 para Em Andamento...">
        </div>

        <button type="submit" class="btn-salvar">
            <span class="material-icons">save</span> Protocolar Ação
        </button>
        
        <a href="PaginaCentral.html" class="btn-cancelar">Cancelar e Voltar</a>
    </form>
</div>

<script>
    document.getElementById('formAcao').addEventListener('submit', async (e) => {
        e.preventDefault();

        const dados = {
            descricao: document.getElementById('descricao').value,
            prazo: document.getElementById('prazo').value,
            cliente_id: parseInt(document.getElementById('cliente_id').value),
            advogado_id: parseInt(document.getElementById('advogado_id').value),
            juiz_id: document.getElementById('juiz_id').value ? parseInt(document.getElementById('juiz_id').value) : null,
            tipo_acao_id: parseInt(document.getElementById('tipo_acao_id').value),
            status_id: parseInt(document.getElementById('status_id').value)
        };

        try {
            const response = await fetch('https://controle-de-a-es-jurid-cas.onrender.com/cadastrar-acao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                alert("Ação protocolada com sucesso no banco de dados!");
                window.location.href = 'listaacoes.html'; // Leva direto para a tabela após salvar
            } else {
                alert("Erro ao salvar. Verifique se os IDs inseridos existem nas tabelas pai.");
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
        }
    });
</script>

</body>
</html>
