<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Processo | CJuris</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
        }
        .container-cadastro {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header-area {
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h2 { margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #7f8c8d; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: white;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary-color); outline: none; }
        .btn-salvar {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-cancelar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #95a5a6;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container-cadastro">
    <div class="header-area">
        <h2><span class="material-icons">gavel</span> Abertura de Processo</h2>
    </div>

    <form id="formAcao">
        <div class="form-group">
            <label>Resumo / Descrição do Processo</label>
            <textarea id="descricao" required rows="3" placeholder="Ex: Ação revisional de contrato..."></textarea>
        </div>

        <div class="form-group">
            <label>Prazo Limite / Audiência</label>
            <input type="date" id="prazo" required>
        </div>

        <div class="form-group">
            <label>Cliente / Parte Interessada</label>
            <select id="cliente_id" required>
                <option value="">Carregando clientes...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Advogado Responsável</label>
            <select id="advogado_id" required>
                <option value="">Carregando advogados...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tipo de Ação</label>
            <select id="tipo_acao_id" required>
                <option value="1">Cível</option>
                <option value="2">Trabalhista</option>
                <option value="3">Criminal</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status Inicial</label>
            <select id="status_id" required>
                <option value="1">Petição Inicial</option>
                <option value="2">Em Andamento</option>
            </select>
        </div>

        <button type="submit" class="btn-salvar">
            <span class="material-icons">save</span> Protocolar Ação
        </button>
        
        <a href="PaginaCentral.html" class="btn-cancelar">Cancelar e Voltar</a>
    </form>
</div>

<script>
    // Função para carregar as pessoas do banco para os selects correspondentes
    async function carregarSeletores() {
        try {
            const response = await fetch('https://controle-de-a-es-jurid-cas.onrender.com/listar-pessoas', {
                method: 'POST'
            });
            const pessoas = await response.json();
            
            const selectCliente = document.getElementById('cliente_id');
            const selectAdvogado = document.getElementById('advogado_id');
            
            selectCliente.innerHTML = '<option value="">Selecione o Cliente</option>';
            selectAdvogado.innerHTML = '<option value="">Selecione o Advogado</option>';
            
            pessoas.forEach(p => {
                // Filtra pelo tipo que vem da sua rota do Sprint 7
                if (p.tipo === 'Cliente') {
                    selectCliente.innerHTML += `<option value="${p.pessoa_id}">${p.nome}</option>`;
                } else {
                    selectAdvogado.innerHTML += `<option value="${p.pessoa_id}">${p.nome}</option>`;
                }
            });
        } catch (error) {
            console.error("Erro ao carregar seletores:", error);
        }
    }

    document.getElementById('formAcao').addEventListener('submit', async (e) => {
        e.preventDefault();

        const dados = {
            descricao: document.getElementById('descricao').value,
            prazo: document.getElementById('prazo').value,
            cliente_id: parseInt(document.getElementById('cliente_id').value),
            advogado_id: parseInt(document.getElementById('advogado_id').value),
            juiz_id: null, // Enviando explicitamente null para o banco aceitar sem erro de FK
            tipo_acao_id: parseInt(document.getElementById('tipo_acao_id').value),
            status_id: parseInt(document.getElementById('status_id').value)
        };

        try {
            const response = await fetch('https://controle-de-a-es-jurid-cas.onrender.com/cadastrar-acao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                alert("Ação criada com sucesso!");
                window.location.href = 'listaacoes.html';
            } else {
                alert("Erro ao salvar no banco. Verifique se os registros de Tipo e Status existem.");
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
        }
    });

    carregarSeletores();
</script>
</body>
</html>
