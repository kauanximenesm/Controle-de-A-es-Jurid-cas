<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>JurisControl | Lista de Ações</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #e67e22;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 40px 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; display: flex; align-items: center; gap: 10px; }
        
        /* Estilos da Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #7f8c8d; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #f1f1f1; font-size: 14px; max-width: 300px; word-wrap: break-word; white-space: normal; }
         
        .btn-action { border: none; padding: 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .btn-edit { background-color: var(--warning-color); color: white; }
        .btn-delete { background-color: var(--danger-color); color: white; margin-left: 8px; }
        .btn-voltar { display: inline-flex; align-items: center; gap: 5px; color: var(--primary-color); text-decoration: none; font-weight: 600; margin-bottom: 20px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 450px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal-header { font-size: 18px; font-weight: 600; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #7f8c8d; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #95a5a6; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
        .btn-save-modal { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <a href="PaginaCentral.html" class="btn-voltar"><span class="material-icons">arrow_back</span> Voltar ao Painel</a>
    <h2><span class="material-icons">assignment</span> Processos e Ações Jurídicas</h2>
    
    <table>
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Tipo</th>
                <th>Cliente</th>
                <th>Advogado</th>
                <th>Prazo</th>
                <th>Status</th>
                <th style="text-align: center;">Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabelaAcoes">
            </tbody>
    </table>
</div>

<div id="modalEditar" class="modal">
    <div class="modal-content">
        <div class="modal-header">Editar Ação Processual</div>
        <input type="hidden" id="edit-id">
        
        <div class="form-group">
            <label>Descrição do Processo</label>
            <textarea id="edit-descricao" rows="3" required></textarea>
        </div>
        
        <div class="form-group">
            <label>Prazo Limite / Audiência</label>
            <input type="date" id="edit-prazo" required>
        </div>
        
        <div class="form-group">
            <label>Status do Processo</label>
            <select id="edit-status" required>
                <option value="1">Petição Inicial</option>
                <option value="2">Em Andamento</option>
                <option value="3">Suspenso</option>
                <option value="4">Arquivado</option>
            </select>
        </div>
        
        <div class="modal-actions">
            <button onclick="fecharModal()" class="btn-cancel">Cancelar</button>
            <button onclick="salvarEdicao()" class="btn-save-modal">Salvar Alterações</button>
        </div>
    </div>
</div>

<script>
    let acoesGerais = []; 

    async function carregarAcoes() {
        try {
            const response = await fetch('https://controle-de-a-es-jurid-cas.onrender.com/listar-acoes');
            acoesGerais = await response.json();
            const tabela = document.getElementById('corpoTabelaAcoes');
            tabela.innerHTML = "";

            if (acoesGerais.length === 0) {
                tabela.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Nenhum processo em andamento.</td></tr>";
                return;
            }

            acoesGerais.forEach(a => {
                const prazoFormatado = a.prazo ? new Date(a.prazo).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : "Sem prazo";
                
                const linha = `<tr>
                    <td><strong>${a.descricao}</strong></td>
                    <td>${a.tipo_acao || 'Cível'}</td>
                    <td>${a.nome_cliente || 'N/A'}</td>
                    <td>${a.nome_advogado || 'N/A'}</td>
                    <td>${prazoFormatado}</td>
                    <td><span style="font-weight:600; color: #2980b9;">${a.status_nome || 'Petição Inicial'}</span></td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button onclick="abrirModalEdicao(${a.acao_id})" class="btn-action btn-edit">
                            <span class="material-icons">edit</span>
                        </button>
                        <button onclick="excluirAcao(${a.acao_id})" class="btn-action btn-delete">
                            <span class="material-icons">delete</span>
                        </button>
                    </td>
                </tr>`;
                tabela.innerHTML += linha;
            });
        } catch (error) {
            console.error("Erro ao carregar ações:", error);
        }
    }

    function abrirModalEdicao(id) {
        const acao = acoesGerais.find(item => item.acao_id === id);
        if (!acao) return;

        document.getElementById('edit-id').value = id;
        document.getElementById('edit-descricao').value = acao.descricao;
        
        if (acao.prazo) {
            const dataIso = new Date(acao.prazo).toISOString().split('T')[0];
            document.getElementById('edit-prazo').value = dataIso;
        } else {
            document.getElementById('edit-prazo').value = "";
        }

        // Mapeia o nome do status de volta para o ID correto
        const mapaStatus = { "Petição Inicial": 1, "Em Andamento": 2, "Suspenso": 3, "Arquivado": 4 };
        document.getElementById('edit-status').value = mapaStatus[acao.status_nome] || 1;

        document.getElementById('modalEditar').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modalEditar').style.display = 'none';
    }

    async function salvarEdicao() {
        const id = document.getElementById('edit-id').value;
        const descricao = document.getElementById('edit-descricao').value;
        const prazo = document.getElementById('edit-prazo').value;
        const status_id = parseInt(document.getElementById('edit-status').value);

        try {
            const response = await fetch(`https://controle-de-a-es-jurid-cas.onrender.com/editar-acao/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descricao, prazo, status_id })
            });

            if (response.ok) {
                alert("Processo atualizado com sucesso!");
                fecharModal();
                carregarAcoes();
            } else {
                alert("Erro ao atualizar o processo.");
            }
        } catch (error) {
            console.error("Erro ao editar:", error);
        }
    }

    async function excluirAcao(id) {
        const confira = confirm("Tem certeza que deseja arquivar/excluir esta ação processual?");
        if (!confira) return;

        try {
            const response = await fetch(`https://controle-de-a-es-jurid-cas.onrender.com/excluir-acao/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Ação removida com sucesso!");
                carregarAcoes();
            }
        } catch (error) {
            console.error("Erro na exclusão:", error);
        }
    }

    carregarAcoes();
</script>
</body>
</html>
