<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Ações | CJuris</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
        }

        .container-lista {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h2 { margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .tabela-acoes { width: 100%; border-collapse: collapse; }

        .tabela-acoes th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #eee;
        }

        .tabela-acoes td {
        padding: 15px;
        border-bottom: 1px solid #f1f1f1;
        font-size: 14px;
        max-width: 300px;         
        word-wrap: break-word;    
        white-space: normal;      
}
        .tabela-acoes tr:hover { background-color: #fcfcfc; }

        .btn-action {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-edit { background-color: var(--warning-color); color: white; }
        .btn-delete { 
        background-color: var(--danger-color); 
        color: white; 
        margin-left: 8px; 
        }
        .btn-delete:hover { background-color: #c0392b; }

        .btn-voltar {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 20px;
        }
        .material-icons { font-size: 16px; }
    </style>
</head>
<body>

<div class="container-lista">
    <div class="header-area">
        <h2><span class="material-icons">gavel</span> Painel de Processos e Ações</h2>
    </div>

    <table class="tabela-acoes">
        <thead>
            <tr>
                <th>Descrição / Resumo</th>
                <th>Tipo</th>
                <th>Cliente</th>
                <th>Advogado</th>
                <th>Prazo Final</th>
                <th>Status</th>
                <th style="text-align: center;">Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabelaAcoes">
            </tbody>
    </table>

    <a href="PaginaCentral.html" class="btn-voltar">
        <span class="material-icons">arrow_back</span> Voltar ao Painel
    </a>
</div>

<script>
    async function carregarAcoes() {
        try {
            const response = await fetch('https://controle-de-a-es-jurid-cas.onrender.com/listar-acoes');
            const acoes = await response.json();
            const tabela = document.getElementById('corpoTabelaAcoes');
            tabela.innerHTML = "";

            if (acoes.length === 0) {
                tabela.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Nenhum processo em andamento.</td></tr>";
                return;
            }

            acoes.forEach(a => {
                const prazoFormatado = a.prazo ? new Date(a.prazo).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : "Sem prazo";
                
                const linha = `<tr>
                    <td><strong>${a.descricao}</strong></td>
                    <td>${a.tipo_acao || 'Cível'}</td>
                    <td>${a.nome_cliente || 'N/A'}</td>
                    <td>${a.nome_advogado || 'N/A'}</td>
                    <td>${prazoFormatado}</td>
                    <td><span style="font-weight:600; color: #2980b9;">${a.status_nome || 'Petição Inicial'}</span></td>
                    <td style="text-align: center; white-space: nowrap;">
                        <button onclick="editarAcao(${a.acao_id}, '${a.descricao}')" class="btn-action btn-edit">
                            <span class="material-icons">edit</span>
                        </button>
                        <button onclick="excluirAcao(${a.acao_id})" class="btn-action btn-delete">
                            <span class="material-icons">delete</span>
                        </button>
                    </td>
                </tr>`;
                tabela.innerHTML += linha;
            });
        } catch (error) {
            console.error("Erro ao carregar ações:", error);
        }
    }

    async function editarAcao(id, descAntiga) {
        const novaDesc = prompt("Atualizar descrição do processo:", descAntiga);
        if (!novaDesc) return;

        try {
            const response = await fetch(`https://controle-de-a-es-jurid-cas.onrender.com/editar-acao/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descricao: novaDesc })
            });

            if (response.ok) {
                alert("Processo atualizado!");
                carregarAcoes();
            }
        } catch (error) {
            console.error("Erro ao editar:", error);
        }
    }

    async function excluirAcao(id) {
        // CONFIRMAÇÃO COM A SUA FRASE DA PRINT
        const confira = confirm("Tem certeza que deseja arquivar/excluir esta ação processual?");
        if (!confira) return;

        console.log("Tentando deletar o ID de ação:", id);

        try {
            const response = await fetch(`https://controle-de-a-es-jurid-cas.onrender.com/excluir-acao/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Ação removida com sucesso!");
                carregarAcoes(); // Recarrega a tabela na hora
            } else {
                const erroTexto = await response.text();
                alert("Erro ao tentar deletar: " + erroTexto);
            }
        } catch (error) {
            console.error("Erro na requisição de exclusão:", error);
            alert("Erro de conexão ao tentar deletar.");
        }
    }

    carregarAcoes();
</script>
</body>
</html>
