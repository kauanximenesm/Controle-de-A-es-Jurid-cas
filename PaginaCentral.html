<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisControl | Dashboard Operacional</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="icon" type="image/x-icon" href="Assets/image.ico">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
            <img src="Assets/favicon.ico" alt="Logo CJuris" style="width: 40px; height: 40px; border-radius: 50%;">
            <h1>Controlador de Ações Jurídicas - CJuris</h1>
        </div>
        <p>Sistema de Gestão de Processos Jurídicos</p>
    </header>

    <div class="admin-actions" style="text-align: center; margin-top: 10px;">
        <button id="btnAdminGestao" onclick="window.location.href='gerenciar.html'" class="btn-admin" style="display: none;">
            <i class="material-icons">settings</i> 
            <span>Gerenciar Usuários</span>
        </button>
    </div>

    <main class="container">
        <section class="banner">
            <img src="Assets/Img-1-Controle Jurídico.png" alt="Estátua da Justiça Horizontal">
        </section>

        <section class="actions">
            <h2>Ações Rápidas</h2>
            <div class="grid-buttons">
                <button onclick="novaAcao()" class="btn btn-add">
                    <i class="material-icons">add</i> Novo Processo
                </button>
                
                <button onclick="window.location.href='cadastro2.html'" class="btn btn-info">
                    <i class="material-icons">person_add</i> Novo Cliente
                </button>

                <button onclick="verPrazos()" class="btn btn-alert">
                    <i class="material-icons">event</i> Ver Prazos
                </button>
                
                <button onclick="listarAdvogados()" class="btn btn-info">
                    <i class="material-icons">gavel</i> Advogados
                </button>
                
                <button onclick="gerarRelatorio()" class="btn btn-print">
                    <i class="material-icons">description</i> Relatório Mensal
                </button>
            </div>
        </section>

        <section id="status-painel" class="status-box">
            <p>Aguardando comando...</p>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 CJuris - Todos os direitos reservados.</p>
            <p>Desenvolvido por <span class="brand">KynneTech</span></p>
            <div class="footer-links">
                <a href="index.html">Suporte</a> | 
                <a href="index.html">Privacidade</a>
            </div>
        </div>
    </footer>

    <script src="Js/main.js"></script>
</body>
</html>
