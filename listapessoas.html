<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pessoas | CJuris</title>
    <link rel="stylesheet" href="Css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .tabela-pessoas { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; color: #333; }
        .tabela-pessoas th, .tabela-pessoas td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .tabela-pessoas th { background-color: #3498db; color: white; }
    </style>
</head>
<body style="background-color: #f4f7f6; padding: 20px;">
    <h2>👤 Clientes e Pessoas Cadastradas</h2>
    <table class="tabela-pessoas">
        <thead>
            <tr>
                <th>Nome</th>
                <th>CPF</th>
                <th>Nascimento</th>
                <th>Tipo</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
            </tbody>
    </table>
    <br>
    <button onclick="window.location.href='PaginaCentral.html'" class="btn btn-add">Voltar ao Painel</button>

    <script src="Js/listapessoas.js"></script>
</body>
</html>
