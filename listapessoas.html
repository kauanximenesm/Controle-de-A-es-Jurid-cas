<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pessoas | CJuris</title>
    <link rel="stylesheet" href="Css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .tabela-pessoas { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; color: #333; }
        .tabela-pessoas th, .tabela-pessoas td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .tabela-pessoas th { background-color: #3498db; color: white; }
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            margin: 0;
        }

        .container-lista {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h2 {
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabela-pessoas {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela-pessoas th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #eee;
        }

        .tabela-pessoas td {
            padding: 15px;
            border-bottom: 1px solid #f1f1f1;
            font-size: 14px;
        }

        .tabela-pessoas tr:hover {
            background-color: #fcfcfc;
        }

        /* Estilo para a Badge do Tipo */
        .badge-tipo {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tipo-advogado { background: #e1f5fe; color: #0288d1; }
        .tipo-cliente { background: #e8f5e9; color: #2e7d32; }

        /* Botões de Ação */
        .btn-action {
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-right: 5px;
        }

        .btn-edit { background-color: var(--warning-color); color: white; }
        .btn-edit:hover { background-color: #d35400; }

        .btn-delete { background-color: var(--danger-color); color: white; }
        .btn-delete:hover { background-color: #c0392b; }

        .btn-voltar {
            background-color: var(--success-color);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 600;
        }

        .material-icons { font-size: 18px; }
    </style>
</head>
<<body>

    <div class="container-lista">
        <div class="header-area">
            <h2><span class="material-icons">groups</span> Clientes e Pessoas Cadastradas</h2>
        </div>
        
        <table class="tabela-pessoas">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Tipo</th>
                    <th style="text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- O JS vai preencher aqui -->
            </tbody>
        </table>

        <button onclick="window.location.href='PaginaCentral.html'" class="btn-voltar">
            <span class="material-icons">arrow_back</span> Voltar ao Painel
        </button>
    </div>

    <script src="Js/listapessoas.js"></script>
</body>
</html>
