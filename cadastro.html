<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | CJuris</title>
    <link rel="stylesheet" href="Css/global.css">
    <link rel="stylesheet" href="Css/login.css">
    <link rel="icon" href="Assets/favicon.ico">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <img src="Assets/favicon.ico" alt="Logo CJuris" class="login-logo">
            <h2>Criar Nova Conta</h2>
            
            <form id="formCadastro">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label for="login">E-mail (Login)</label>
                    <input type="email" id="login" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" 
                    placeholder="Mín. 8 caracteres, 1 número e 1 especial" 
                    pattern="(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}" 
                    title="A senha deve ter pelo menos 8 caracteres, incluindo um número e um caractere especial (!@#$%^&*)"
                    required>
                </div>
                
                <button type="submit" class="btn-login">Finalizar Cadastro</button>
            </form>
            <label for="perfil">Tipo de Perfil:</label>
            <select id="perfil" name="perfil" class="meu-input-estilizado">
                <option value="1">Advogado</option>
                <option value="2">Assistente Jurídico</option>
                <option value="3">Coordenador</option>
                <option value="4">Cliente</option>
                <option value="5">Administrador</option>
            </select>
            <div class="login-footer">
                <p>Já tem uma conta?</p>
                <a href="Login.html" class="back-link" style="color: #3498db; font-weight: bold;">Fazer Login</a>
            </div>
        </div>
    </div>

    <script src="Js/cadastro.js"></script>
</body>
</html>
